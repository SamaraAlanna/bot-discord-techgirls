# Publica o Worker no Cloudflare a cada push na main (etapa 9 da seção 13).
#
# Dois jobs: os testes rodam primeiro e o deploy só começa se todos passarem
# (`needs`). O token da Cloudflare só existe no job de deploy: o job de testes
# nunca enxerga secret nenhum.
#
# Versões conferidas em 17/10/2026, na doc da Cloudflare (Workers > CI/CD > GitHub
# Actions) e nas páginas de release de cada action (seção 12).

name: Deploy

on:
  push:
    branches:
      - main

# Só leitura do repositório: o workflow não escreve nada no GitHub.
permissions:
  contents: read

# Dois pushes seguidos não publicam ao mesmo tempo: o segundo espera o primeiro.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` instala exatamente o que está no package-lock.json.
      - run: npm ci

      - run: npm test

  deploy:
    name: Publicar no Cloudflare
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Instala o Wrangler do devDependencies, na versão travada no lockfile. Sem
      # `wranglerVersion`, a action usa a instalação que já existe, então o deploy
      # roda com o mesmo Wrangler do `npm run deploy` local.
      - run: npm ci

      # Os secrets do bot (DISCORD_TOKEN e os outros) não passam por aqui: eles
      # vivem no Worker, postos com `wrangler secret put`, e o deploy não mexe neles.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
